name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python3 -m venv .venv && .venv/bin/pip install -r deploy/python-runtime.txt
      - run: npm ci
      - run: npm run build && npm test
      - run: .venv/bin/python -m unittest discover -s tests -v
      - run: python3 scripts/package.py
  release:
    needs: core
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Package source
        run: python3 scripts/package.py
      - name: Publish new source version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; keep its source and tag unchanged."
            exit 0
          fi
          python3 - <<'PY' > "$RUNNER_TEMP/neon-release-notes.md"
          import json
          from pathlib import Path
          version = json.loads(Path("package.json").read_text())["version"]
          lines = Path("CHANGELOG.md").read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.startswith("## " + version + " "))
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("## ")), len(lines))
          print("\n".join(lines[start + 1:end]).strip())
          print("\nSource publication only; existing servers are not updated by this workflow.")
          PY
          options=()
          if [[ "$version" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$tag" \
            "artifacts/releases/neon-desktop-${version}-source.tar.gz" \
            artifacts/releases/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "Neon Desktop ${version}" \
            --notes-file "$RUNNER_TEMP/neon-release-notes.md" \
            "${options[@]}"
